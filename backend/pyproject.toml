[project]
name = "tire_shop"
version = "0.0.1"
description = ""
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [
  { name = "albus.cygnus", email = "albus.cygnus@yandex.ru" },
]

dependencies = [
  "fastapi>=0.128.0",
  "faststream[rabbit]>=0.6.5",
  "sqlmodel>=0.0.31",
  "alembic>=1.18.1",
  "pydantic-settings>=2.12.0",
  "tenacity>=9.1.2",
  "pyjwt>=2.10.1",
  "passlib>=1.7.4",
  "bcrypt==4.0.1",
  "psycopg[binary,pool]>=3.3.2",
  "email-validator>=2.3.0",
  "emails<1.0,>=0.6",
  "jinja2>=3.1.6",
  "python-multipart>=0.0.21",
  "argon2-cffi>=25.1.0",
  "fastapi-mail[httpx]>=1.6.1",
  "uvicorn[standard]>=0.40.0",
]

[dependency-groups]
dev = [
    "fastapi[standard]>=0.128.0",
    "faststream[cli]>=0.5.25",
    "ruff>=0.7.2",
    "mypy>=1.13.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.14.0",
    "pytest>=9.0.2",
    "httpx>=0.28.1",
]

[project.scripts]
server = "uvicorn app.main:app --host 0.0.0.0 --port 8000"
server-dev = "fastapi dev --host 0.0.0.0 app/main.py"
lint-check = "ruff check app"
lint-format = "ruff format app"
prestart = "python -m app.backend_pre_start && python -m alembic upgrade head && python -m app.initial_data"

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]
addopts = ["-vv", "--import-mode=importlib"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 88
lint.select = ["E", "F", "I", "B"]
extend-exclude = [
    "app/alembic/versions",
    "**/alembic/versions",
]